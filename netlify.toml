[build]
  command = "npm run build"
  publish = "out"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://static.cloudflareinsights.com https://cdn.sender.net https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ w.soundcloud.com; connect-src 'self' https://api.github.com https://api.netlify.com https://unpkg.com https://cloudflareinsights.com https://wave.sndcdn.com https://cdn.sender.net https://stats.sender.net https://www.google.com/recaptcha/; frame-src 'self' https://app.netlify.com https://w.soundcloud.com https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com;"
