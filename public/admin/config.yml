backend:
  name: github
  repo: idmick/boyos-collective
  branch: main
  site_domain: www.boyoscollective.nl
  squash_merges: true

publish_mode: editorial_workflow
media_folder: public/images/uploads
public_folder: /images/uploads
local_backend: true

collections:
  - name: site_content
    label: Site Content
    files:
      - name: home
        label: Home Page
        file: data/home.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Image, name: image, widget: image }
          - label: Identity Cards
            name: identities
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Badge, name: badge, widget: image }
              - { label: Image, name: image, widget: image }
              - { label: Link, name: href, widget: string }
              - { label: Button Label, name: cta, widget: string }
              - label: Tone
                name: tone
                widget: select
                options: [pink, teal]
              - { label: Body, name: body, widget: text }
          - label: Merch
            name: merch
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Body, name: body, widget: text }

      - name: wonderland
        label: Wonderland Page
        file: data/wonderland.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Badge, name: badge, widget: image }
              - { label: Subtitle, name: subtitle, widget: text }
          - label: Story
            name: story
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Logo, name: logo, widget: image }
              - { label: Image, name: image, widget: image }
              - label: Body
                name: body
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: Pillars
            name: pillars
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Upcoming Rows
            name: upcomingRows
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Date, name: date, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Venue, name: venue, widget: string }
              - { label: Tag, name: tag, widget: string }
          - label: Albums
            name: albums
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Cover, name: cover, widget: image }
              - { label: URL, name: url, widget: string }
          - label: Philosophy
            name: philosophy
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }

      - name: summer_jam
        label: Summer Jam
        file: data/summerJam.json
        format: json
        fields:
          - label: Event Details
            name: event
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Short Title, name: shortTitle, widget: string }
              - { label: Page Path, name: href, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
              - { label: Date Label, name: dateLabel, widget: string }
              - { label: Time Label, name: timeLabel, widget: string }
              - { label: Venue Name, name: venueName, widget: string }
              - { label: Venue URL, name: venueUrl, widget: string }
              - { label: Location Label, name: locationLabel, widget: string }
              - { label: Poster, name: poster, widget: image }
              - { label: Format, name: format, widget: string }
              - label: Partners
                name: partners
                widget: list
                default:
                  - Boyos Wonderland
                  - INI Movement
                  - Houtbaar
                  - Oshi
                field: { label: Partner, name: partner, widget: string }
              - { label: Ticket Label, name: ticketLabel, widget: string }
              - { label: Ticket URL, name: ticketUrl, widget: string, default: "https://www.houtbaarhaarlem.nl/" }
              - { label: Line-up Label, name: lineUpLabel, widget: string, default: "Hosted by SYNGA · TOMMASO · Estafête (live) · UMOJA · Shamis · Boyos Soundsystem" }
              - { label: WhatsApp URL, name: whatsappUrl, widget: string }
              - { label: Instagram URL, name: instagramUrl, widget: string }
              - { label: INI URL, name: iniUrl, widget: string }
              - { label: INI Instagram URL, name: iniInstagramUrl, widget: string }
              - { label: Directions URL, name: directionsUrl, widget: string }
              - label: Address
                name: address
                widget: object
                fields:
                  - { label: Street Address, name: streetAddress, widget: string }
                  - { label: Postal Code, name: postalCode, widget: string }
                  - { label: City, name: addressLocality, widget: string }
                  - { label: Country, name: addressCountry, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Page Content
            name: page
            widget: object
            fields:
              - label: SEO
                name: seo
                widget: object
                default:
                  title: Summer Jam Haarlem | Boyos Wonderland x INI Movement
                  description: Summer Jam is a one day mini-festival at Houtbaar, Haarlem on Saturday 25 July 2026 by Boyos Wonderland and INI Movement, with DJs, live musicians, pop-up tattoos and an indoor afterparty till 02:00.
                  keywords: Summer Jam Haarlem, Houtbaar Haarlem, Boyos Wonderland, INI Movement, Boyos Soundsystem, Haarlem mini festival, Amsterdam DJ collective, disco house DJ Netherlands, pop-up tattoo event Haarlem
                  canonical: https://www.boyoscollective.nl/wonderland/summer-jam
                  ogTitle: Summer Jam Haarlem | Boyos Wonderland x INI Movement
                  ogImage: https://www.boyoscollective.nl/images/summer-jam-poster.png
                  ogImageAlt: Summer Jam poster
                  siteName: Boyos Collective
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Keywords, name: keywords, widget: text }
                  - { label: Canonical URL, name: canonical, widget: string }
                  - { label: Open Graph Title, name: ogTitle, widget: string }
                  - { label: Open Graph Image, name: ogImage, widget: string }
                  - { label: Open Graph Image Alt, name: ogImageAlt, widget: string }
                  - { label: Site Name, name: siteName, widget: string }
              - label: Hero
                name: hero
                widget: object
                default:
                  backLabel: ← Boyos Wonderland
                  presentedBy: Boyos Wonderland & INI Movement present
                  titleLines:
                    - Summer
                    - Jam
                  subtitle: A mini festival
                  secondaryCtaLabel: Follow the build-up
                  stats:
                    dateLabel: Date
                    timeLabel: Time
                    venueLabel: Venue
                    formatLabel: Format
                fields:
                  - { label: Back Label, name: backLabel, widget: string }
                  - { label: Presented By, name: presentedBy, widget: string }
                  - label: Title Lines
                    name: titleLines
                    widget: list
                    field: { label: Line, name: line, widget: string }
                  - { label: Subtitle, name: subtitle, widget: string }
                  - { label: Secondary CTA Label, name: secondaryCtaLabel, widget: string }
                  - label: Stat Labels
                    name: stats
                    widget: object
                    fields:
                      - { label: Date Label, name: dateLabel, widget: string }
                      - { label: Time Label, name: timeLabel, widget: string }
                      - { label: Venue Label, name: venueLabel, widget: string }
                      - { label: Format Label, name: formatLabel, widget: string }
              - label: Section Headings
                name: sections
                widget: object
                default:
                  concept:
                    eyebrow: How it moves
                    title: From 13:00 To 02:00
                  lineup:
                    eyebrow: Line-up
                    title: Who's Bringing The Groove
                  partners:
                    eyebrow: Together with
                    title: The Partners
                  practicalInfo:
                    eyebrow: Practical info
                    title: Good To Know
                fields:
                  - label: Concept
                    name: concept
                    widget: object
                    fields:
                      - { label: Eyebrow, name: eyebrow, widget: string }
                      - { label: Title, name: title, widget: string }
                  - label: Lineup
                    name: lineup
                    widget: object
                    fields:
                      - { label: Eyebrow, name: eyebrow, widget: string }
                      - { label: Title, name: title, widget: string }
                  - label: Partners
                    name: partners
                    widget: object
                    fields:
                      - { label: Eyebrow, name: eyebrow, widget: string }
                      - { label: Title, name: title, widget: string }
                  - label: Practical Info
                    name: practicalInfo
                    widget: object
                    fields:
                      - { label: Eyebrow, name: eyebrow, widget: string }
                      - { label: Title, name: title, widget: string }
              - label: Ticker
                name: ticker
                widget: list
                default:
                  - Boyos Wonderland x INI Movement
                  - 25 July 2026
                  - Houtbaar Haarlem
                  - Open Jam
                  - DJ Sets
                  - Estafête Live
                  - Hosted by SYNGA
                  - Pop-up Tattoo
                  - Powered by Oshi
                  - Afterparty till 02:00
                field: { label: Item, name: item, widget: string }
              - label: Final CTA
                name: finalCta
                widget: object
                default:
                  eyebrow: Tickets
                  title: Meet us where the garden turns into a dancefloor.
                  body: Summer Jam brings Boyos Wonderland and INI Movement together for a full day of open jam energy, DJs, live musicians, pop-up tattoos and warm selections. We start outside at Houtbaar in Haarlem, then move inside after 23:00 and keep going till 02:00. Tickets start at €20 through Houtbaar.
                  secondaryLabel: Follow the build-up
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Secondary Button Label, name: secondaryLabel, widget: string }
              - { label: Lineup Intro, name: lineupIntro, widget: text, default: "The timetable is still taking shape, so this is not a play-by-play. It is a feel for the people and sounds carrying the day: live energy, deep record bags, warm club pressure and Boyos groove." }
              - { label: Partner Button Label, name: partnerCtaLabel, widget: string, default: Visit }
              - label: Practical Info Cards
                name: practicalInfo
                widget: list
                summary: "{{fields.label}}"
                default:
                  - label: Date
                    value: Saturday 25 July 2026
                    detail: Summer in Haarlem, starting early afternoon.
                  - label: Time
                    value: 13:00 – 23:00 + afterparty till 02:00
                    detail: The garden closes at 23:00, then the night moves inside until 02:00.
                  - label: Location
                    value: Houtbaar, Haarlem
                    detail: Woudplein 2, 2031CZ Haarlem
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value, name: value, widget: string }
                  - { label: Detail, name: detail, widget: text }
              - label: Concept Paragraphs
                name: concept
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
              - label: Day Arc
                name: dayArc
                widget: list
                summary: "{{fields.time}} - {{fields.name}}"
                fields:
                  - { label: Time, name: time, widget: string }
                  - { label: Name, name: name, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: Partners
                name: partners
                widget: list
                summary: "{{fields.name}}"
                default:
                  - name: Boyos Wonderland
                    description: The event world around Boyos Collective; music, food, art, tattoos, and a dancefloor with room for everyone.
                    href: /wonderland
                  - name: INI Movement
                    description: A creative movement bringing live music and open participation into the day.
                    href: https://www.inimovement.nl/
                  - name: Houtbaar
                    description: The Haarlem home base for the open-air part of the day and the indoor continuation after 23:00.
                    href: https://www.houtbaarhaarlem.nl/
                  - name: Powered by Oshi
                    description: Oshi helps power the community energy around the day, connecting the music, movement and people around Summer Jam.
                    href: https://www.instagram.com/oshi_community/
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Link, name: href, widget: string }
              - label: Lineup
                name: lineup
                widget: list
                summary: "{{fields.name}}"
                default:
                  - name: Open Jam
                    role: Open musical energy
                    description: The open jam is not a fixed show slot or a closed band moment. It is the loose, participatory pulse of the afternoon; musicians, friends and the garden finding the rhythm together.
                  - name: SYNGA
                    role: Host
                    description: SYNGA is the voice guiding Summer Jam through the day; hosting the open jams and Estafête, bringing soulful R&B instinct, synth textures and raw beat energy into the garden.
                    image: /images/artists/synga.jpg
                    imagePosition: center 18%
                    sourceUrl: https://www.instagram.com/synga.music/
                  - name: Estafête
                    role: Live formation
                    description: Estafête is a live formation put together for movement, not a traditional band with a fixed front. DJs and musicians pass energy back and forth, letting the set build in the moment.
                    image: /images/artists/estafete.jpg
                    sourceUrl: https://www.inimovement.nl/events/estafte-makz-shamis-rode-hoed
                  - name: TOMMASO
                    role: Vinyl selector
                    description: Tommaso Conforti is a Florence-born, Chicago-based vinyl selector and record digger with a deep ear for house music history and global rarities. His sets connect forgotten gems, soulful club records and forward-moving dancefloor moments. He is also behind Elevator Music Live, a platform creating space for artists and live dance music culture between Chicago and wider dancefloor communities.
                    image: /images/artists/tommaso-conforti.jpg
                  - name: UMOJA
                    role: DJ duo
                    description: UMOJA are a Dutch DJ and producer duo with a name that means togetherness. Their sound moves through global grooves, percussion, bass, and warm club energy, always with the feeling of people meeting each other on the floor.
                    image: /images/artists/umoja.jpg
                    sourceUrl: https://ra.co/dj/umoja
                  - name: Shamis
                    role: DJ, producer, vocalist
                    description: Shamis is a producer, DJ, vocalist, and co-founder of INI Movement. His work blends soulful electronics, live instinct, and community energy, making him a natural guide between the jam, the stage, and the late-night room.
                    image: /images/artists/shamis.jpg
                    sourceUrl: https://www.shamis-is.com/about
                  - name: Boyos Soundsystem
                    role: Resident groove keepers
                    description: Boyos Soundsystem bring the essential groove at the heart of the day; disco, house, Brazilian boogie, soca, zouk, italo, afro house, and the kind of selections that make a garden feel like a shared living room.
                    image: /images/boyos-25-20.jpg
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Image, name: image, widget: image, required: false }
                  - { label: Image Position, name: imagePosition, widget: string, required: false }
                  - { label: Source URL, name: sourceUrl, widget: string, required: false }
              - label: Partner Logos
                name: partnerLogos
                widget: list
                summary: "{{fields.name}}"
                default:
                  - name: Boyos Wonderland
                    image: /images/partners/boyos-sun.png
                    href: /wonderland
                  - name: INI Movement
                    image: /images/partners/ini.png
                    href: https://www.inimovement.nl/
                  - name: Houtbaar
                    image: /images/partners/houtbaar.png
                    href: https://www.houtbaarhaarlem.nl/
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Image, name: image, widget: image }
                  - { label: Link, name: href, widget: string }

      - name: soundsystem
        label: Soundsystem Page
        file: data/soundsystem.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Badge, name: badge, widget: image }
              - label: DJs
                name: djs
                widget: list
                field: { label: DJ, name: dj, widget: string }
          - label: About
            name: about
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - label: Stats
                name: stats
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
              - label: Body
                name: body
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: Artists
            name: artists
            widget: list
            summary: "{{fields.number}} - {{fields.name}}"
            fields:
              - { label: Number, name: number, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Image, name: image, widget: image }
          - label: Genres
            name: genres
            widget: list
            field: { label: Genre, name: genre, widget: string }
          - label: Sets
            name: sets
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Embed URL, name: url, widget: string }
              - label: Type
                name: type
                widget: select
                options: [soundcloud, youtube]
          - label: Ticker
            name: ticker
            widget: list
            field: { label: Item, name: item, widget: string }
          - label: Booking
            name: booking
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
              - { label: Link, name: href, widget: string }
              - { label: Button Label, name: cta, widget: string }

      - name: past_gigs
        label: Past Gigs
        file: data/PastGigs.json
        format: json
        fields:
          - label: Past Gigs
            name: pastGigs
            widget: list
            summary: "{{fields.monthYear}} - {{fields.venue}}"
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - { label: Venue, name: venue, widget: string }
              - { label: Month / Year, name: monthYear, widget: string }
