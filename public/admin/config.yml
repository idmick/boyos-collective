backend:
  name: github
  repo: idmick/boyos-collective
  branch: main
  site_domain: www.boyoscollective.nl
  squash_merges: true

publish_mode: editorial_workflow
media_folder: public/images/uploads
public_folder: /images/uploads
local_backend: true

collections:
  - name: wonderland_events
    label: Wonderland Events
    label_singular: Wonderland Event
    folder: data/wonderland-events
    create: true
    format: json
    extension: json
    slug: "{{slug}}"
    summary: "{{title}} · {{date}} · {{venueName}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short Title, name: shortTitle, widget: string }
      - label: Hero Title Lines
        name: titleLines
        widget: list
        field: { label: Line, name: line, widget: string }
      - label: Short Title Lines
        name: shortTitleLines
        widget: list
        field: { label: Line, name: line, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, picker_utc: true }
      - { label: Start Date and Time, name: startDateTime, widget: datetime, date_format: YYYY-MM-DD, time_format: HH:mm, picker_utc: false }
      - { label: End Date and Time, name: endDateTime, widget: datetime, date_format: YYYY-MM-DD, time_format: HH:mm, picker_utc: false }
      - { label: Venue Name, name: venueName, widget: string }
      - { label: Venue Website, name: venueUrl, widget: string }
      - label: Address
        name: address
        widget: object
        fields:
          - { label: Street Address, name: streetAddress, widget: string }
          - { label: Postal Code, name: postalCode, widget: string }
          - { label: City, name: addressLocality, widget: string }
          - { label: Country, name: addressCountry, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Details Label, name: detailsLabel, widget: string }
      - label: Short Introduction
        name: intro
        widget: list
        field: { label: Paragraph, name: paragraph, widget: text }
      - label: Main Story
        name: body
        widget: list
        field: { label: Paragraph, name: paragraph, widget: text }
      - { label: Portrait Poster, name: poster, widget: image }
      - { label: Landscape Hero, name: heroImage, widget: image }
      - label: Line-up
        name: lineup
        widget: list
        summary: "{{fields.name}}"
        fields:
          - { label: Billing Name, name: name, widget: string }
          - label: Artist Links
            name: links
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
      - label: Tickets
        name: tickets
        widget: object
        fields:
          - { label: Ticket URL, name: url, widget: string }
          - { label: Currency, name: currency, widget: select, options: [EUR] }
          - { label: Availability, name: availability, widget: select, options: [InStock, SoldOut, PreOrder] }
          - { label: Status Label, name: statusLabel, widget: string }
          - label: Ticket Tiers
            name: tiers
            widget: list
            summary: "{{fields.name}} · €{{fields.total}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Base Price, name: price, widget: number, value_type: float, min: 0 }
              - { label: Service Fee, name: serviceFee, widget: number, value_type: float, min: 0, required: false }
              - { label: Total, name: total, widget: number, value_type: float, min: 0 }
      - label: Practical Information
        name: practical
        widget: object
        fields:
          - { label: Minimum Age, name: minimumAge, widget: string }
          - { label: Doors, name: doors, widget: string }
          - { label: End, name: end, widget: string }
          - { label: Re-entry, name: reentry, widget: string }
          - { label: Lockers, name: lockers, widget: string }
      - { label: Instagram URL, name: instagramUrl, widget: string }
      - { label: Resident Advisor URL, name: residentAdvisorUrl, widget: string, required: false }
      - label: Event Images
        name: images
        widget: object
        required: false
        fields:
          - { label: Landscape 16:9, name: landscape16x9, widget: string, required: false }
          - { label: Landscape 4:3, name: landscape4x3, widget: string, required: false }
          - { label: Square 1:1, name: square, widget: string, required: false }
      - label: SEO and Social Sharing
        name: seo
        widget: object
        fields:
          - { label: SEO Title, name: title, widget: string }
          - { label: SEO Description, name: description, widget: text }
          - { label: Open Graph Title, name: ogTitle, widget: string }
          - { label: Open Graph Image, name: ogImage, widget: string }
          - { label: Open Graph Image Alt, name: ogImageAlt, widget: string }

  - name: site_content
    label: Site Content
    files:
      - name: home
        label: Home Page
        file: data/home.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Image, name: image, widget: image }
          - label: Next Event Section
            name: nextEventSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Event Button Label, name: detailsCtaLabel, widget: string }
              - { label: All Events Button Label, name: allEventsCtaLabel, widget: string }
          - label: Identity Cards
            name: identities
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Badge, name: badge, widget: image }
              - { label: Image, name: image, widget: image }
              - { label: Link, name: href, widget: string }
              - { label: Button Label, name: cta, widget: string }
              - label: Tone
                name: tone
                widget: select
                options: [pink, teal]
              - { label: Body, name: body, widget: text }
          - label: Merch
            name: merch
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Body, name: body, widget: text }

      - name: wonderland
        label: Wonderland Page
        file: data/wonderland.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Badge, name: badge, widget: image }
              - { label: Subtitle, name: subtitle, widget: text }
          - label: Current Event
            name: currentEventSlug
            widget: relation
            collection: wonderland_events
            search_fields: [title, venueName, date]
            value_field: "{{slug}}"
            display_fields: [title, date, venueName]
          - label: Community
            name: community
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
              - { label: Button Label, name: ctaLabel, widget: string }
              - { label: WhatsApp URL, name: url, widget: string }
              - label: Email Signup Introduction
                name: emailSignup
                widget: object
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
          - label: Story
            name: story
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Logo, name: logo, widget: image }
              - { label: Image, name: image, widget: image }
              - label: Body
                name: body
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: Pillars
            name: pillars
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Past Editions
            name: pastEditions
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Date Label, name: dateLabel, widget: string }
              - { label: Venue Label, name: venueLabel, widget: string }
              - { label: Page Path, name: href, widget: string }
              - { label: Poster, name: poster, widget: image }
          - label: Albums
            name: albums
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Cover, name: cover, widget: image }
              - { label: URL, name: url, widget: string }
          - label: Philosophy
            name: philosophy
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }

      - name: summer_jam
        label: Summer Jam
        file: data/summerJam.json
        format: json
        fields:
          - label: Event Details
            name: event
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Short Title, name: shortTitle, widget: string }
              - { label: Page Path, name: href, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
              - { label: Date Label, name: dateLabel, widget: string }
              - { label: Time Label, name: timeLabel, widget: string }
              - { label: Venue Name, name: venueName, widget: string }
              - { label: Venue URL, name: venueUrl, widget: string }
              - { label: Location Label, name: locationLabel, widget: string }
              - { label: Poster, name: poster, widget: image }
              - { label: Format, name: format, widget: string }
              - label: Partners
                name: partners
                widget: list
                default:
                  - Boyos Wonderland
                  - INI Movement
                  - Houtbaar
                  - Oshi
                field: { label: Partner, name: partner, widget: string }
              - { label: Line-up Label, name: lineUpLabel, widget: string, default: "AEV.AYA · SYNGA · Boyos Soundsystem · Shamis · Tommaso · Estafête · UMOJA" }
              - { label: Instagram URL, name: instagramUrl, widget: string }
              - { label: INI URL, name: iniUrl, widget: string }
              - { label: INI Instagram URL, name: iniInstagramUrl, widget: string }
              - { label: Directions URL, name: directionsUrl, widget: string }
              - label: Address
                name: address
                widget: object
                fields:
                  - { label: Street Address, name: streetAddress, widget: string }
                  - { label: Postal Code, name: postalCode, widget: string }
                  - { label: City, name: addressLocality, widget: string }
                  - { label: Country, name: addressCountry, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Page Content
            name: page
            widget: object
            fields:
              - label: SEO
                name: seo
                widget: object
                default:
                  title: Summer Jam 2026 Haarlem | Boyos Wonderland Archive
                  description: Summer Jam brought Boyos Wonderland and INI Movement to Houtbaar, Haarlem on 25 July 2026 for open jams, DJs, live music, records, tattoos and an inside afterparty.
                  canonical: https://www.boyoscollective.nl/wonderland/summer-jam
                  ogTitle: Summer Jam 2026 | Boyos Wonderland x INI Movement
                  ogImage: https://www.boyoscollective.nl/images/og/summer-jam.jpg
                  ogImageAlt: Summer Jam at Houtbaar Haarlem
                  siteName: Boyos Collective
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Canonical URL, name: canonical, widget: string }
                  - { label: Open Graph Title, name: ogTitle, widget: string }
                  - { label: Open Graph Image, name: ogImage, widget: string }
                  - { label: Open Graph Image Alt, name: ogImageAlt, widget: string }
                  - { label: Site Name, name: siteName, widget: string }
              - label: Hero
                name: hero
                widget: object
                default:
                  backLabel: ← Boyos Wonderland
                  presentedBy: Past edition · Boyos Wonderland & INI Movement
                  titleLines:
                    - Summer
                    - Jam
                  subtitle: Houtbaar, Haarlem · 25 July 2026
                  primaryCtaLabel: See the next Wonderland edition
                  secondaryCtaLabel: Read the 3voor12 interview
                  stats:
                    dateLabel: Date
                    timeLabel: Time
                    venueLabel: Venue
                    formatLabel: Format
                fields:
                  - { label: Back Label, name: backLabel, widget: string }
                  - { label: Presented By, name: presentedBy, widget: string }
                  - label: Title Lines
                    name: titleLines
                    widget: list
                    field: { label: Line, name: line, widget: string }
                  - { label: Subtitle, name: subtitle, widget: string }
                  - { label: Primary CTA Label, name: primaryCtaLabel, widget: string }
                  - { label: Secondary CTA Label, name: secondaryCtaLabel, widget: string }
                  - label: Stat Labels
                    name: stats
                    widget: object
                    fields:
                      - { label: Date Label, name: dateLabel, widget: string }
                      - { label: Time Label, name: timeLabel, widget: string }
                      - { label: Venue Label, name: venueLabel, widget: string }
                      - { label: Format Label, name: formatLabel, widget: string }
              - label: Section Headings
                name: sections
                widget: object
                default:
                  concept:
                    eyebrow: How it moves
                    title: From 13:00 To 02:00
                  lineup:
                    eyebrow: Line-up
                    title: Who's Bringing The Groove
                  partners:
                    eyebrow: Together with
                    title: The Partners
                  practicalInfo:
                    eyebrow: Edition details
                    title: At a glance
                fields:
                  - label: Concept
                    name: concept
                    widget: object
                    fields:
                      - { label: Eyebrow, name: eyebrow, widget: string }
                      - { label: Title, name: title, widget: string }
                  - label: Lineup
                    name: lineup
                    widget: object
                    fields:
                      - { label: Eyebrow, name: eyebrow, widget: string }
                      - { label: Title, name: title, widget: string }
                  - label: Partners
                    name: partners
                    widget: object
                    fields:
                      - { label: Eyebrow, name: eyebrow, widget: string }
                      - { label: Title, name: title, widget: string }
                  - label: Practical Info
                    name: practicalInfo
                    widget: object
                    fields:
                      - { label: Eyebrow, name: eyebrow, widget: string }
                      - { label: Title, name: title, widget: string }
              - label: Ticker
                name: ticker
                widget: list
                default:
                  - Boyos Wonderland x INI Movement
                  - 25 July 2026
                  - Houtbaar Haarlem
                  - Open Jam
                  - DJ Sets
                  - Estafête Live
                  - Hosted by SYNGA
                  - Pop-up Tattoo
                  - Powered by Oshi
                  - Afterparty till 02:00
                field: { label: Item, name: item, widget: string }
              - label: Timetable
                name: schedule
                widget: object
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string }
                  - { label: Title, name: title, widget: string }
                  - label: Garden Programme
                    name: garden
                    widget: object
                    fields:
                      - { label: Title, name: title, widget: string }
                      - { label: Hours, name: hours, widget: string }
                      - label: Schedule
                        name: items
                        widget: list
                        summary: "{{fields.time}} — {{fields.name}}"
                        fields:
                          - { label: Time, name: time, widget: string }
                          - { label: Name, name: name, widget: string }
                  - label: Inside Afterparty
                    name: afterparty
                    widget: object
                    fields:
                      - { label: Title, name: title, widget: string }
                      - { label: Hours, name: hours, widget: string }
                      - label: Schedule
                        name: items
                        widget: list
                        summary: "{{fields.time}} — {{fields.name}}"
                        fields:
                          - { label: Time, name: time, widget: string }
                          - { label: Name, name: name, widget: string }
                  - { label: Open Jam Note, name: openJamNote, widget: text }
              - label: Press Feature
                name: press
                widget: object
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Summary, name: summary, widget: text }
                  - { label: Link Label, name: linkLabel, widget: string }
                  - { label: URL, name: url, widget: string }
              - label: Final CTA
                name: finalCta
                widget: object
                default:
                  eyebrow: Past edition
                  title: The day the garden became a dancefloor.
                  body: Summer Jam moved from an open afternoon in the garden to a full room inside, carried by live improvisation, warm selections and the Haarlem community.
                  primaryLabel: See the next Wonderland edition
                  secondaryLabel: Read the 3voor12 interview
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Primary Button Label, name: primaryLabel, widget: string }
                  - { label: Secondary Button Label, name: secondaryLabel, widget: string }
              - { label: Lineup Intro, name: lineupIntro, widget: text, default: "The programme moved between DJ sets, an open musical floor and Estafête's live response. These are the people who carried the day and the extras found around the garden." }
              - { label: Partner Button Label, name: partnerCtaLabel, widget: string, default: Visit }
              - label: Practical Info Cards
                name: practicalInfo
                widget: list
                summary: "{{fields.label}}"
                default:
                  - label: Date
                    value: Saturday 25 July 2026
                    detail: Summer in Haarlem, starting early afternoon.
                  - label: Time
                    value: 13:00 – 23:00 + afterparty till 02:00
                    detail: The garden closes at 23:00, then the night moves inside until 02:00.
                  - label: Location
                    value: Houtbaar, Haarlem
                    detail: Woudplein 2, 2031CZ Haarlem
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value, name: value, widget: string }
                  - { label: Detail, name: detail, widget: text }
              - label: Concept Paragraphs
                name: concept
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
              - label: Day Arc
                name: dayArc
                widget: list
                summary: "{{fields.time}} - {{fields.name}}"
                fields:
                  - { label: Time, name: time, widget: string }
                  - { label: Name, name: name, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: Partners
                name: partners
                widget: list
                summary: "{{fields.name}}"
                default:
                  - name: Boyos Wonderland
                    description: The event world around Boyos Collective; music, food, art, tattoos, and a dancefloor with room for everyone.
                    href: /wonderland
                  - name: INI Movement
                    description: A creative movement bringing live music and open participation into the day.
                    href: https://www.inimovement.nl/
                  - name: Houtbaar
                    description: The Haarlem home base for the open-air part of the day and the indoor continuation after 23:00.
                    href: https://www.houtbaarhaarlem.nl/
                  - name: Powered by Oshi
                    description: Oshi helps power the community energy around the day, connecting the music, movement and people around Summer Jam.
                    href: https://www.instagram.com/oshi_community/
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Link, name: href, widget: string }
              - label: Programme Groups
                name: lineupGroups
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Eyebrow, name: eyebrow, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Introduction, name: intro, widget: text }
              - label: Lineup
                name: lineup
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Image, name: image, widget: image }
                  - { label: Image Alt Text, name: alt, widget: string }
                  - label: Programme Group
                    name: group
                    widget: select
                    options:
                      - { label: Featured, value: featured }
                      - { label: Estafête, value: estafete }
                      - { label: Daytime Extras, value: extras }
                  - { label: Image Position, name: imagePosition, widget: string, required: false }
                  - label: Structured Data Type
                    name: schemaType
                    widget: select
                    required: false
                    options:
                      - { label: Person, value: Person }
                      - { label: Music Group, value: MusicGroup }
                  - { label: Structured Data Name, name: schemaName, widget: string, required: false }
                  - { label: Source URL, name: sourceUrl, widget: string, required: false }
              - label: Partner Logos
                name: partnerLogos
                widget: list
                summary: "{{fields.name}}"
                default:
                  - name: Boyos Wonderland
                    image: /images/partners/boyos-sun.png
                    href: /wonderland
                  - name: INI Movement
                    image: /images/partners/ini.png
                    href: https://www.inimovement.nl/
                  - name: Houtbaar
                    image: /images/partners/houtbaar.png
                    href: https://www.houtbaarhaarlem.nl/
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Image, name: image, widget: image }
                  - { label: Link, name: href, widget: string }

      - name: soundsystem
        label: Soundsystem Page
        file: data/soundsystem.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Badge, name: badge, widget: image }
              - label: DJs
                name: djs
                widget: list
                field: { label: DJ, name: dj, widget: string }
          - label: About
            name: about
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - label: Stats
                name: stats
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
              - label: Body
                name: body
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: Artists
            name: artists
            widget: list
            summary: "{{fields.number}} - {{fields.name}}"
            fields:
              - { label: Number, name: number, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Image, name: image, widget: image }
          - label: Genres
            name: genres
            widget: list
            field: { label: Genre, name: genre, widget: string }
          - label: Sets
            name: sets
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Embed URL, name: url, widget: string }
              - label: Type
                name: type
                widget: select
                options: [soundcloud, youtube]
          - label: Ticker
            name: ticker
            widget: list
            field: { label: Item, name: item, widget: string }
          - label: Booking
            name: booking
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
              - { label: Link, name: href, widget: string }
              - { label: Button Label, name: cta, widget: string }

      - name: past_gigs
        label: Past Gigs
        file: data/PastGigs.json
        format: json
        fields:
          - label: Past Gigs
            name: pastGigs
            widget: list
            summary: "{{fields.monthYear}} - {{fields.venue}}"
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - { label: Venue, name: venue, widget: string }
              - { label: Month / Year, name: monthYear, widget: string }
