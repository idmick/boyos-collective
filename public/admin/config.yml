backend:
  name: github
  repo: idmick/boyos-collective
  branch: main
  site_domain: www.boyoscollective.nl
  squash_merges: true

publish_mode: editorial_workflow
media_folder: public/images/uploads
public_folder: /images/uploads
local_backend: true

collections:
  - name: site_content
    label: Site Content
    files:
      - name: home
        label: Home Page
        file: data/home.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Image, name: image, widget: image }
          - label: Identity Cards
            name: identities
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Badge, name: badge, widget: image }
              - { label: Image, name: image, widget: image }
              - { label: Link, name: href, widget: string }
              - { label: Button Label, name: cta, widget: string }
              - label: Tone
                name: tone
                widget: select
                options: [pink, teal]
              - { label: Body, name: body, widget: text }
          - label: Merch
            name: merch
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Body, name: body, widget: text }

      - name: wonderland
        label: Wonderland Page
        file: data/wonderland.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Badge, name: badge, widget: image }
              - { label: Subtitle, name: subtitle, widget: text }
          - label: Story
            name: story
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Logo, name: logo, widget: image }
              - { label: Image, name: image, widget: image }
              - label: Body
                name: body
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: Pillars
            name: pillars
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Upcoming Rows
            name: upcomingRows
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Date, name: date, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Venue, name: venue, widget: string }
              - { label: Tag, name: tag, widget: string }
          - label: Albums
            name: albums
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Cover, name: cover, widget: image }
              - { label: URL, name: url, widget: string }
          - label: Philosophy
            name: philosophy
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }

      - name: summer_jam
        label: Summer Jam
        file: data/summerJam.json
        format: json
        fields:
          - label: Event Details
            name: event
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Short Title, name: shortTitle, widget: string }
              - { label: Page Path, name: href, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
              - { label: Date Label, name: dateLabel, widget: string }
              - { label: Time Label, name: timeLabel, widget: string }
              - { label: Venue Name, name: venueName, widget: string }
              - { label: Venue URL, name: venueUrl, widget: string }
              - { label: Location Label, name: locationLabel, widget: string }
              - { label: Poster, name: poster, widget: image }
              - { label: Format, name: format, widget: string }
              - label: Partners
                name: partners
                widget: list
                field: { label: Partner, name: partner, widget: string }
              - { label: Ticket Label, name: ticketLabel, widget: string }
              - { label: Line-up Label, name: lineUpLabel, widget: string }
              - { label: WhatsApp URL, name: whatsappUrl, widget: string }
              - { label: Instagram URL, name: instagramUrl, widget: string }
              - { label: INI URL, name: iniUrl, widget: string }
              - { label: INI Instagram URL, name: iniInstagramUrl, widget: string }
              - { label: Directions URL, name: directionsUrl, widget: string }
              - label: Address
                name: address
                widget: object
                fields:
                  - { label: Street Address, name: streetAddress, widget: string }
                  - { label: Postal Code, name: postalCode, widget: string }
                  - { label: City, name: addressLocality, widget: string }
                  - { label: Country, name: addressCountry, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Page Content
            name: page
            widget: object
            fields:
              - label: Concept Paragraphs
                name: concept
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
              - label: Day Arc
                name: dayArc
                widget: list
                summary: "{{fields.time}} - {{fields.name}}"
                fields:
                  - { label: Time, name: time, widget: string }
                  - { label: Name, name: name, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: Partners
                name: partners
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Link, name: href, widget: string }

      - name: soundsystem
        label: Soundsystem Page
        file: data/soundsystem.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Badge, name: badge, widget: image }
              - label: DJs
                name: djs
                widget: list
                field: { label: DJ, name: dj, widget: string }
          - label: About
            name: about
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - label: Stats
                name: stats
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
              - label: Body
                name: body
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: Artists
            name: artists
            widget: list
            summary: "{{fields.number}} - {{fields.name}}"
            fields:
              - { label: Number, name: number, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Image, name: image, widget: image }
          - label: Genres
            name: genres
            widget: list
            field: { label: Genre, name: genre, widget: string }
          - label: Sets
            name: sets
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Embed URL, name: url, widget: string }
              - label: Type
                name: type
                widget: select
                options: [soundcloud, youtube]
          - label: Ticker
            name: ticker
            widget: list
            field: { label: Item, name: item, widget: string }
          - label: Booking
            name: booking
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
              - { label: Link, name: href, widget: string }
              - { label: Button Label, name: cta, widget: string }

      - name: past_gigs
        label: Past Gigs
        file: data/PastGigs.json
        format: json
        fields:
          - label: Past Gigs
            name: pastGigs
            widget: list
            summary: "{{fields.monthYear}} - {{fields.venue}}"
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - { label: Venue, name: venue, widget: string }
              - { label: Month / Year, name: monthYear, widget: string }
